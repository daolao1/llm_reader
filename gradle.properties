org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# 注意：这里刻意不再硬编码 org.gradle.java.home。
# JDK 17 由 settings.gradle.kts 里的 foojay-resolver 插件自动解析/下载，
# 这样 CI（ubuntu/windows/macos）和任何开发机都能直接构建。
# 本机若 gradlew 报 "Unable to locate a Java Runtime"，说明启动 Gradle 的 JVM 缺失，
# 用 Homebrew 安装的 JDK 注册到系统即可：
#   sudo ln -sfn /opt/homebrew/opt/openjdk@17/libexec/openjdk.jdk /Library/Java/JavaVirtualMachines/openjdk-17.jdk
# 或临时指定：JAVA_HOME=/opt/homebrew/opt/openjdk@17/libexec/openjdk.jdk/Contents/Home ./gradlew ...

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# shared 模块手工声明了 jvmSharedMain 这一中间源集（Android 与 Desktop 共用 JVM 实现），
# 因此显式关掉默认层级模板，避免 Gradle 再自动生成一套。
kotlin.mpp.applyDefaultHierarchyTemplate=false
# AGP 8.6 比 KGP 2.0.21 声称"已测试"的上限（8.5）高一个版本，功能正常，屏蔽提示。
kotlin.mpp.androidGradlePluginCompatibility.nowarn=true

# Compose Multiplatform 在 CI 上跑无头打包时需要
org.jetbrains.compose.experimental.jscanvas.enabled=false

# jpackage 的供应商白名单校验。本机用 Homebrew 的 openjdk@17 打包桌面端时，
# Compose 会因为"未知供应商"直接报错拒绝打包，这里放开。
# 发布用的正式安装包由 CI 用 Temurin 构建（见 .github/workflows/release.yml），
# 本地若发现 .dmg 有问题，请改用 Temurin 再打包一次。
compose.desktop.packaging.checkJdkVendor=false
