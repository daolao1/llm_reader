# =============================================================================
# Release workflow - llm_reader (Kotlin Multiplatform: Android + Compose Desktop)
#
# 触发
#   * 推送 v* tag      -> 版本号取自 tag（v1.2.3 -> 1.2.3）
#   * workflow_dispatch-> 版本号取自 version 输入，缺省用 DEFAULT_VERSION
#
# 签名
#   Android 的 release 签名配置**写死在仓库根目录的 keystore.properties**
#   （keystore 文件：keystore/release.keystore），因此 CI 不需要配置任何 Secret，
#   直接 `:app:assembleRelease` 就能产出正式签名的 APK。
#
#   ⚠️ 这要求仓库保持**私有**：签名私钥在版本控制里。若把仓库改为公开，
#      任何人都会拿到这把 key，可以签出与你 App 同包名、同签名的 APK，
#      安卓会将其视为合法更新。轮换方式见 keystore.properties。
#
# 版本注入
#   每次 Gradle 调用都会带上 -PversionName=<name> -PversionCode=<major*10000+minor*100+patch>
# =============================================================================

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '要发布的版本号，如 1.2.3 或 1.2.3-beta.1（从 tag 触发时忽略此项）'
        required: false
        type: string
        default: ''

# 默认最小权限；只有 release 任务提升到 contents: write
permissions:
  contents: read

# 同一 ref 只保留一次运行；但 tag 触发的运行永不取消（已发布的版本必须跑完）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  DEFAULT_VERSION: '1.0.0'

jobs:
  # ---------------------------------------------------------------------------
  # 统一解析版本号，供其余任务复用
  # ---------------------------------------------------------------------------
  prepare:
    name: Resolve version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_code: ${{ steps.version.outputs.version_code }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Derive versionName and versionCode
        id: version
        env:
          # 通过 env 传参而不是直接插值进脚本，避免注入
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
            origin="tag ${GITHUB_REF_NAME}"
          elif [ -n "${INPUT_VERSION}" ]; then
            version="${INPUT_VERSION#v}"
            origin="workflow_dispatch input"
          else
            version="${DEFAULT_VERSION}"
            origin="fallback default"
          fi

          version="$(printf '%s' "${version}" | tr -d '[:space:]')"
          if [ -z "${version}" ]; then
            version="${DEFAULT_VERSION}"
            origin="fallback default"
          fi
          if ! printf '%s' "${version}" | grep -Eq '^[0-9]+(\.[0-9]+){0,2}(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "::error::版本号 '${version}'（来自 ${origin}）不合法。期望形如 1.2.3 或 1.2.3-beta.1。"
            exit 1
          fi

          # versionCode = major * 10000 + minor * 100 + patch
          core="${version%%-*}"
          core="${core%%+*}"
          IFS='.' read -r major minor patch <<< "${core}"
          major="${major:-0}"
          minor="${minor:-0}"
          patch="${patch:-0}"
          for part in "${major}" "${minor}" "${patch}"; do
            if ! printf '%s' "${part}" | grep -Eq '^[0-9]+$'; then
              echo "::error::无法从 '${version}' 推导出整数 versionCode。"
              exit 1
            fi
          done
          version_code=$(( 10#${major} * 10000 + 10#${minor} * 100 + 10#${patch} ))

          prerelease=false
          case "${version}" in
            *-*) prerelease=true ;;
          esac

          tag="v${version}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          fi

          {
            echo "version=${version}"
            echo "version_code=${version_code}"
            echo "tag=${tag}"
            echo "prerelease=${prerelease}"
          } >> "${GITHUB_OUTPUT}"

          {
            echo "### Release ${tag}"
            echo ""
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| source | ${origin} |"
            echo "| versionName | \`${version}\` |"
            echo "| versionCode | \`${version_code}\` |"
            echo "| release tag | \`${tag}\` |"
            echo "| prerelease | \`${prerelease}\` |"
          } >> "${GITHUB_STEP_SUMMARY}"

          echo "version=${version} versionCode=${version_code} tag=${tag} prerelease=${prerelease} (${origin})"

  # ---------------------------------------------------------------------------
  # Android release APK（签名配置来自仓库内的 keystore.properties）
  # ---------------------------------------------------------------------------
  android:
    name: Android APK
    runs-on: ubuntu-latest
    needs: prepare
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK (platform 34, build-tools 34.0.0)
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'
          accept-android-sdk-licenses: true

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build release APK
        env:
          VERSION_NAME: ${{ needs.prepare.outputs.version }}
          VERSION_CODE: ${{ needs.prepare.outputs.version_code }}
        run: |
          set -euo pipefail
          if [ ! -f keystore.properties ]; then
            echo "::error title=缺少签名配置::keystore.properties 不在工作区里。它是写死签名的来源，必须提交进仓库。"
            exit 1
          fi
          ./gradlew :app:assembleRelease \
            -PversionName="${VERSION_NAME}" \
            -PversionCode="${VERSION_CODE}"

      - name: Verify the APK is signed with the release key
        run: |
          set -euo pipefail
          apk="$(ls app/build/outputs/apk/release/*.apk | head -1)"
          echo "检查 ${apk}"
          "${ANDROID_HOME}/build-tools/34.0.0/apksigner" verify --print-certs "${apk}" \
            | tee /tmp/certs.txt
          # debug 签名的 CN 是 "Android Debug"；出现它说明 keystore.properties 没生效
          if grep -qi 'Android Debug' /tmp/certs.txt; then
            echo "::error title=签名错误::APK 用的是 debug 签名，keystore.properties 未生效。"
            exit 1
          fi

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Compose Desktop 安装包：Linux→deb / Windows→msi / macOS→dmg
  # ---------------------------------------------------------------------------
  desktop:
    name: Desktop ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: prepare
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            task: packageDeb
            out_dir: deb
            ext: deb
          - os: windows-latest
            task: packageMsi
            out_dir: msi
            ext: msi
          - os: macos-latest
            task: packageDmg
            out_dir: dmg
            ext: dmg
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle wrapper executable
        shell: bash
        run: chmod +x ./gradlew

      - name: Ensure WiX Toolset v3 (jpackage 做 MSI 必需)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # jpackage 生成 .msi 依赖 WiX 的 candle.exe / light.exe。
          # 注意：JDK 17 的 jpackage **只支持 WiX v3**（v4/v5 支持是 JDK-8319457
          # 才加的），所以不能只判断 candle.exe 是否存在 —— runner 上可能装的是
          # v4/v5，那样 jpackage 依然会失败。这里认准 v3 的安装目录。
          function Find-WixV3 {
            $hit = Get-ChildItem "C:\Program Files (x86)\WiX Toolset v3*\bin\candle.exe" `
                     -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($hit) { return $hit.DirectoryName } else { return $null }
          }

          $wixBin = Find-WixV3
          if (-not $wixBin) {
            Write-Host "未找到 WiX v3，开始安装 3.14.1…"
            choco install wixtoolset --version=3.14.1 -y --no-progress --allow-downgrade
            $wixBin = Find-WixV3
          }
          if (-not $wixBin) { throw "WiX v3 安装后仍未找到，jpackage 无法生成 MSI" }

          # GITHUB_PATH 里的条目会被 runner 前置到 PATH，因此 v3 优先于可能存在的 v4/v5
          Add-Content -Path $env:GITHUB_PATH -Value $wixBin
          Write-Host "使用 WiX v3: $wixBin"
          & "$wixBin\candle.exe" -? 2>&1 | Select-Object -First 2

      - name: Package ${{ matrix.ext }} installer
        # 三个平台统一用 bash + ./gradlew：
        # Windows runner 上 run: 默认走 PowerShell，而 PowerShell 会把
        # "-PversionName=1.0.0" 在第一个点处拆成 -PversionName=1 与 .0.0，
        # 后者被 Gradle 当成任务名报 "Task '.0.0' not found"。改用 bash 后
        # 参数解析语义与 Linux/macOS 完全一致（windows-latest 自带 Git Bash）。
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew ":desktop:${{ matrix.task }}" \
            "-PversionName=${{ needs.prepare.outputs.version }}" \
            "-PversionCode=${{ needs.prepare.outputs.version_code }}"

      - name: Dump jpackage logs on failure
        if: failure()
        shell: bash
        run: |
          # jpackage 的真实报错只写进它自己的日志文件，Gradle 不会转述，这里兜出来
          for f in desktop/build/compose/logs/${{ matrix.task }}/*; do
            [ -f "$f" ] || continue
            echo "===================== $f ====================="
            cat "$f" || true
          done

      - name: Show produced installer(s)
        if: always()
        shell: bash
        run: ls -lR desktop/build/compose/binaries/main/${{ matrix.out_dir }}/ || true

      - name: Upload ${{ matrix.ext }} installer
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.ext }}
          path: desktop/build/compose/binaries/main/${{ matrix.out_dir }}/*.${{ matrix.ext }}
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 发布 Release，附上全部安装包
  # ---------------------------------------------------------------------------
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - prepare
      - android
      - desktop
    # 用 always() 让本任务在桌面端部分平台失败时依然执行 —— 否则一个平台挂掉
    # 就会因为 needs 语义把整个 Release 一起拖死，其它平台已经打好的包也发不出去。
    # 只要求 prepare 与 android 成功（APK 是主要产物），桌面端的包有哪个发哪个。
    if: ${{ always() && needs.prepare.result == 'success' && needs.android.result == 'success' && (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch') }}
    permissions:
      contents: write
    timeout-minutes: 30
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List release assets
        run: ls -lR dist

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # tag 触发时复用已推送的 tag；workflow_dispatch 时在触发提交上创建 v<version>
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.prepare.outputs.tag }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          fail_on_unmatched_files: false
          files: |
            dist/*.apk
            dist/**/*.apk
            dist/*.deb
            dist/**/*.deb
            dist/*.msi
            dist/**/*.msi
            dist/*.dmg
            dist/**/*.dmg
